[package]
name = "tj-agent"
version = "0.1.0"
edition = "2021"
description = "Turbo Jumbo's thin storage agent: the storage protocol over this machine's model disks."
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
# For the bulk receive: hyper hands over the upgraded connection, and
# hyper-util names the IO type axum::serve wraps it in, which is what lets the
# handler recover the raw socket to splice from. Both are already in the tree
# under axum; naming them here makes the coupling explicit.
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# No TLS on purpose: agents speak plain http on the LAN, like the app's own
# peer traffic. `stream` feeds the hash-frame reader in the send job.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
rustix = { version = "1", features = ["fs", "pipe", "process"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: a safetensors header's "dominant dtype" is the *first*
# tensor in the document, and serde_json's default map would sort the keys.
serde_json = { version = "1", features = ["preserve_order"] }
# Archived upstream but stable; swap for a maintained fork (serde_yaml_ng /
# saphyr) once one is picked deliberately rather than by guess.
serde_yaml = "0.9"
sha2 = "0.10"
# Already in the tree under tokio; named here to open the listener dual-stack
# (IPv6 with IPv4 mapped in), which tokio's own bind can't ask for.
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
